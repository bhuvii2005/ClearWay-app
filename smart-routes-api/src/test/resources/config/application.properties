# Test-only overrides, loaded on top of application.yml. The app reads the root .env, which may
# hold real AI keys; Spring Boot tests must never call a real model, so AI is off here. AI tests
# build their pieces with fake models instead, and live checks run only with ./gradlew evalTest.
clearway.ai.enabled=false
clearway.ai.kb.ingest-on-startup=false
