# Retrieval eval: each query has the knowledge-base file (src/main/resources/kb/) that should be in the
# top 4. The off-topic queries should find nothing above the threshold.
queries:
  - query: "What is a safe level of PM2.5 according to the WHO?"
    expectedFile: who-air-quality-guidelines.md
  - query: "WHO annual average limit for nitrogen dioxide"
    expectedFile: who-air-quality-guidelines.md
  - query: "What does a Moderate air quality index reading mean?"
    expectedFile: european-aqi-bands.md
  - query: "How is the European AQI worked out from different pollutants?"
    expectedFile: european-aqi-bands.md
  - query: "Should I go running outside when pollution is high?"
    expectedFile: exercising-in-poor-air.md
  - query: "Tips for cycling to work on smoggy days"
    expectedFile: exercising-in-poor-air.md
  - query: "How do fine particles harm the heart and lungs?"
    expectedFile: pollutant-health-effects.md
  - query: "Which groups of people are most at risk from air pollution?"
    expectedFile: pollutant-health-effects.md
  - query: "How does ClearWay rank routes by exposure?"
    expectedFile: how-clearway-scores-routes.md
  - query: "When does ClearWay send a poor air alert for a saved route?"
    expectedFile: how-clearway-scores-routes.md
offTopic:
  - "Best pizza restaurants in Naples"
  - "How do I change a flat car tyre?"
  - "Who won the football World Cup in 2018?"
  - "How do Python list comprehensions work?"
  - "Recipe for chocolate chip cookies"
