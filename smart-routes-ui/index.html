<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fa" />
    <meta name="description" content="ClearWay finds the route with the cleanest air, not just the fastest." />
    <title>ClearWay</title>
    <script>
      // Apply the saved theme before the first paint, so dark-theme users never see a light flash.
      try {
        if (localStorage.getItem('cw-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#070b12';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
