# Builds and tests ClearWay on every push and pull request. Free on GitHub for public repos.
#
# - No real database, server or API key is used. Backend integration tests start their own
#   throwaway PostGIS container (Testcontainers) that is deleted when the tests finish.
# - Tests use mock TomTom / Open-Meteo clients and test-only JWT secrets, so no credentials
#   are needed. If a future step needs one, add it under Settings > Secrets and variables >
#   Actions and read it as ${{ secrets.NAME }}; never write it in this file.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-routes-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --no-daemon build
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: smart-routes-api/build/reports/tests/test
          retention-days: 7

  web:
    name: Web app (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-routes-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smart-routes-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Use placeholder settings from .env.example
        run: cp .env.example .env
      - name: Check compose file
        run: docker compose config --quiet
      - name: Build images (not pushed anywhere)
        run: docker compose build
